<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2EDF8" />
      <stop offset="50%" stop-color="#EFF5FA" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Crisp Daylight Sky Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad3)" />

  <!-- Suburban Villa & City Delivery Backdrop -->
  <g opacity="0.18" fill="#64748B">
    <path d="M1250,780 L1250,560 L1450,420 L1650,560 L1650,780 Z" />
    <rect x="1400" y="600" width="100" height="180" fill="#94A3B8" />
    <circle cx="1450" cy="510" r="30" fill="#94A3B8" />
    <rect x="1680" y="480" width="180" height="300" />
  </g>

  <!-- Pavement / Roadway -->
  <path d="M0,780 L1920,780 L1920,1080 L0,1080 Z" fill="#1E293B" />
  <line x1="0" y1="920" x2="1920" y2="920" stroke="#F28C28" stroke-width="8" stroke-dasharray="60,40" opacity="0.8" />

  <!-- Delivery Van / Mini Truck -->
  <g transform="translate(1120, 500)" filter="url(#shadow3)">
    <rect x="40" y="60" width="380" height="220" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <rect x="40" y="150" width="380" height="35" fill="#17365D" />
    <text x="230" y="175" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#F28C28" text-anchor="middle" letter-spacing="3">DOOR-TO-DOOR RELOCATION</text>

    <!-- Cabin -->
    <path d="M420,110 L480,110 L540,170 L550,280 L420,280 Z" fill="#F28C28" />
    <path d="M440,125 L475,125 L525,170 L440,170 Z" fill="#E0F2FE" opacity="0.9" />

    <!-- Wheels -->
    <circle cx="120" cy="300" r="42" fill="#0F172A" />
    <circle cx="120" cy="300" r="18" fill="#94A3B8" />
    <circle cx="480" cy="300" r="42" fill="#0F172A" />
    <circle cx="480" cy="300" r="18" fill="#94A3B8" />
  </g>

  <!-- Multi-Layer Protected Furniture Packaging -->
  <g transform="translate(940, 600)" filter="url(#shadow3)">
    <!-- Sofa Protected with Bubble Wrap & Shrink Film -->
    <rect x="0" y="40" width="160" height="130" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="4" stroke-dasharray="6,4" />
    <rect x="20" y="60" width="120" height="30" rx="4" fill="#F28C28" opacity="0.95" />
    <text x="80" y="80" font-family="sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF" text-anchor="middle">5-LAYER PACK</text>

    <!-- Dolly / Hand Truck -->
    <line x1="-20" y1="180" x2="30" y2="90" stroke="#DC2626" stroke-width="8" stroke-linecap="round" />
    <line x1="-30" y1="180" x2="5" y2="180" stroke="#DC2626" stroke-width="8" stroke-linecap="round" />
    <circle cx="-15" cy="180" r="16" fill="#0F172A" />
  </g>

  <!-- Trust Guarantee Ribbon -->
  <g transform="translate(1480, 260)">
    <rect x="0" y="0" width="220" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow3)" />
    <text x="110" y="32" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#17365D" text-anchor="middle">ON-TIME DELIVERY</text>
    <text x="110" y="58" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#16A34A" text-anchor="middle">Verified Handling Crew</text>
  </g>

  <!-- Sun Glow -->
  <circle cx="1680" cy="170" r="240" fill="#FDE68A" opacity="0.30" filter="blur(50px)" />
</svg>